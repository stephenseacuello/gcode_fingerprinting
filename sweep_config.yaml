program: scripts/evaluation/run_decoder_quick_test.py
method: bayes
metric:
  name: val/token_accuracy
  goal: maximize

parameters:
  encoder_config:
    values:
      - f110_w256_s64
      - f110_w128_s32
      - f110_w64_s16
      - f110_w16_s4
      - f104_w64_s16
      - f98_w64_s16
      - f74_w64_s16
      - f56_w256_s128
      - f56_w128_s32
      - f56_w64_s16
  lr:
    values: [0.0001, 0.0003, 0.0005]
  digit_weight:
    values: [2, 5, 10]
  legacy_weight:
    values: [0.0, 0.5, 1.0]
  label_smoothing:
    values: [0.0, 0.1, 0.2]
  scheduled_sampling:
    values: [0.0, 0.3, 0.5]
  focal_gamma:
    values: [0.0, 1.0, 2.0]
  d_model:
    values: [128, 192, 256]
  n_layers:
    values: [2, 4, 6]
  n_heads:
    values: [4, 8]
  dropout:
    values: [0.1, 0.3, 0.5]
  weight_decay:
    values: [0.01, 0.05]
  batch_size:
    values: [16, 32, 64]

command:
  - ${env}
  - python3
  - ${program}
  - --vocab=data/gcode_vocab_712.json
  - --output_dir=outputs/decoder20260304/sweep
  - --epochs=250
  - --patience=50
  - --wandb
  - ${args}
