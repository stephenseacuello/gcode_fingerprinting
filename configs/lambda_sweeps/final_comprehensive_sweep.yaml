# Final Comprehensive Ray Tune Sweep
# Explores: Architecture (wide/shallow vs deep), Augmentation, Noise, Optimizers, Schedulers
# Based on finding: wide+shallow (d_model=1536, n_layers=4) achieved 82.05%
# Target: Lambda Labs GPU cluster (8x L40S)

name: gcode-final-comprehensive-sweep
project: gcode-fingerprinting

search_space:
  # ============ ARCHITECTURE SPACE ============
  # Explore wide+shallow vs narrow+deep tradeoff

  # Model width
  d_model:
    type: choice
    values: [512, 768, 1024, 1280, 1536, 1792, 2048]

  # Model depth
  n_layers:
    type: choice
    values: [2, 3, 4, 5, 6, 8, 10, 12]

  # Attention heads
  n_heads:
    type: choice
    values: [8, 16, 24, 32]

  # FFN multiplier
  ffn_multiplier:
    type: choice
    values: [2, 3, 4, 5, 6]

  # ============ REGULARIZATION ============
  dropout:
    type: uniform
    min: 0.10
    max: 0.45

  embed_dropout:
    type: uniform
    min: 0.03
    max: 0.25

  drop_path_rate:
    type: uniform
    min: 0.05
    max: 0.25

  # ============ SENSOR PRIOR ============
  use_sensor_prior:
    type: choice
    values: [true, false]

  sensor_prior_weight:
    type: uniform
    min: 0.30
    max: 0.80

  # ============ AUGMENTATION ============
  use_augmentation:
    type: choice
    values: [true, false]

  augment_prob:
    type: uniform
    min: 0.10
    max: 0.50

  # Noise injection
  noise_std:
    type: loguniform
    min: 0.001
    max: 0.1

  # Mixup/CutMix style augmentation
  mixup_alpha:
    type: uniform
    min: 0.0
    max: 0.4

  # ============ OPTIMIZER ============
  optimizer:
    type: choice
    values: ["adamw", "adam", "sgd", "radam", "nadam"]

  learning_rate:
    type: loguniform
    min: 1e-5
    max: 2e-3

  weight_decay:
    type: loguniform
    min: 0.001
    max: 0.2

  # AdamW betas
  beta1:
    type: uniform
    min: 0.85
    max: 0.95

  beta2:
    type: uniform
    min: 0.95
    max: 0.9999

  # SGD momentum (used if optimizer=sgd)
  momentum:
    type: uniform
    min: 0.85
    max: 0.99

  # ============ SCHEDULER ============
  scheduler:
    type: choice
    values: ["cosine_restarts", "cosine", "linear_warmup", "step", "exponential", "one_cycle"]

  warmup_epochs:
    type: choice
    values: [5, 10, 15, 20, 25, 30]

  restart_period:
    type: choice
    values: [15, 20, 25, 30, 40, 50]

  # For step scheduler
  step_size:
    type: choice
    values: [20, 30, 40, 50]

  gamma:
    type: uniform
    min: 0.1
    max: 0.5

  # ============ TRAINING ============
  label_smoothing:
    type: uniform
    min: 0.02
    max: 0.20

  batch_size:
    type: choice
    values: [8, 12, 16, 24, 32]

  grad_clip:
    type: choice
    values: [0.25, 0.5, 1.0, 2.0, 5.0]

  # ============ POOLING ============
  pooling_n_heads:
    type: choice
    values: [4, 8, 16, 32]

  pooling_n_queries:
    type: choice
    values: [8, 16, 32, 64]

  # ============ ENCODER TRAINING ============
  op_loss_weight:
    type: loguniform
    min: 0.05
    max: 1.0

  encoder_lr_scale:
    type: loguniform
    min: 0.01
    max: 0.2

  use_multihead_pooling:
    type: choice
    values: [true, false]

  # ============ SCHEDULED SAMPLING ============
  use_scheduled_sampling:
    type: choice
    values: [true, false]

  teacher_forcing_end:
    type: uniform
    min: 0.5
    max: 0.9

  # ============ SEQUENCE ============
  max_seq_len:
    type: choice
    values: [24, 32, 48, 64]

# Fixed parameters
fixed:
  seed: 123
  max_epochs: 300
  patience: 60
  use_enhanced_encoder: true

# Ray Tune settings
ray_tune:
  num_samples: 300  # More trials for larger search space
  max_concurrent_trials: 8

  scheduler:
    type: ASHAScheduler
    max_t: 300
    grace_period: 25  # At least 25 epochs before pruning
    reduction_factor: 3

  search_alg:
    type: OptunaSearch
    metric: val_token_acc
    mode: max

# Resources per trial
resources:
  gpu: 1
  cpu: 4

# Checkpointing
checkpoint:
  frequency: 10
  keep_num: 3

# WandB integration
wandb:
  project: gcode-final-sweep
  group: lambda-final-comprehensive
