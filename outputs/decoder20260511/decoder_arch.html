</head>
<body>

  <marker id="a-gn" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16A34A"/></marker>
  <marker id="a-or" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#D97706"/></marker>
  <marker id="a-pu" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  <marker id="a-rd" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#DC2626"/></marker>

  <marker id="a-pk" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#DB2777"/></marker>
  <marker id="a-aux" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="7" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9CA3AF"/></marker>

</defs>

<rect width="1300" height="1820" fill="url(#bg-grad)"/>

<!-- ============================================================ -->
<!-- TITLE                                                        -->
<!-- ============================================================ -->
<text x="650" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827" letter-spacing="0.3">SensorMultiHeadDecoder Architecture (20260511)</text>
<text x="650" y="64" text-anchor="middle" font-size="14" fill="#6B7280">Per-Row G-Code Recovery on Frozen Multi-Modal Sensor Encoder  ·  ~39.9M total parameters (31.28M decoder + 8.6M frozen encoder)</text>

<!-- ============================================================ -->
<!-- LANE LABELS                                                  -->
<!-- ============================================================ -->
<g font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.4" text-anchor="start">
  <text x="30" y="120" transform="rotate(-90,30,120)">SENSOR INPUT</text>
  <text x="30" y="320" transform="rotate(-90,30,320)">ENCODER (FROZEN)</text>
  <text x="30" y="610" transform="rotate(-90,30,610)">DECODER</text>
  <text x="30" y="1050" transform="rotate(-90,30,1050)">PREDICTION HEADS</text>
  <text x="30" y="1440" transform="rotate(-90,30,1440)">GRAMMAR-MASKED OUTPUT</text>
</g>

<!-- ============================================================ -->
<!-- 1. SENSOR INPUT (top)                                        -->
<!-- ============================================================ -->
<g>
  <rect x="80" y="90" width="1140" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow-lg)"/>
  <text x="650" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">64-second Sensor Window  (T=256 samples @ 4 Hz, C=98 channels across 7 modality groups)</text>
  <g font-size="11" fill="#475569">
    <text x="120" y="140">accel (18)</text>
    <text x="230" y="140">gyro (18)</text>
    <text x="340" y="140">magneto (18)</text>
    <text x="470" y="140">temp (6)</text>
    <text x="560" y="140">color (24)</text>
    <text x="670" y="140">audio-RMS (6)</text>
    <text x="800" y="140">motor-current (8)</text>
    <text x="950" y="140">— from 6 distributed sensor units (frame_l2/l3/r2, spindle2, y_bed__3/4)</text>
  </g>
  <text x="650" y="160" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">shape: (B, 256, 98)</text>
</g>

<!-- arrow input -> encoder -->
<path d="M 650 170 L 650 200" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)"/>

<!-- ============================================================ -->
<!-- 2. FROZEN ENCODER                                            -->
<!-- ============================================================ -->
<g>
  <rect x="280" y="205" width="740" height="170" rx="12" fill="url(#enc-grad)" stroke="#4338CA" stroke-width="2" filter="url(#shadow-lg)"/>
  <text x="650" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#1E1B4B">MM-DTAE-LSTM Encoder  (8.6M params, FROZEN)</text>
  <text x="650" y="254" text-anchor="middle" font-size="11" fill="#3730A3" font-style="italic">prior contribution; not retrained in this paper</text>

  <!-- internals -->
  <g>
    <rect x="310" y="270" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1"/>
    <text x="390" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Per-Modality MLPs</text>
    <text x="390" y="307" text-anchor="middle" font-size="10" fill="#475569">7 projections → d=256</text>
    <text x="390" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-style="italic">LN + GELU + Dropout</text>
    <text x="390" y="340" text-anchor="middle" font-size="9" fill="#64748B">+ learned modality gates</text>
  </g>

  <g>
    <rect x="495" y="270" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1"/>
    <text x="575" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">Cross-Modal MHA</text>
    <text x="575" y="307" text-anchor="middle" font-size="10" fill="#475569">multi-head self-attention</text>
    <text x="575" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-style="italic">denoising objective</text>
    <text x="575" y="340" text-anchor="middle" font-size="9" fill="#64748B">σ-Gaussian input noise</text>
  </g>

  <g>
    <rect x="680" y="270" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="1"/>
    <text x="760" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#1E1B4B">2-Layer LSTM</text>
    <text x="760" y="307" text-anchor="middle" font-size="10" fill="#475569">hidden=256</text>
    <text x="760" y="322" text-anchor="middle" font-size="9" fill="#64748B" font-style="italic">temporal accumulation</text>
    <text x="760" y="340" text-anchor="middle" font-size="9" fill="#64748B">outputs memory tensor</text>
  </g>

  <g>
    <rect x="865" y="270" width="130" height="80" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="930" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">FROZEN</text>
    <text x="930" y="310" text-anchor="middle" font-size="9" fill="#78350F">96.3% 9-class</text>
    <text x="930" y="324" text-anchor="middle" font-size="9" fill="#78350F">operation-class</text>
    <text x="930" y="338" text-anchor="middle" font-size="9" fill="#78350F">accuracy (prior work)</text>
  </g>
  <path d="M 470 310 L 495 310" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M 655 310 L 680 310" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</g>

<!-- arrow encoder -> memory -->
<path d="M 650 375 L 650 405" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a-frz)"/>

<!-- Memory tensor pill -->
<g>
  <rect x="430" y="408" width="440" height="42" rx="20" fill="url(#mem-grad)" filter="url(#shadow-lg)"/>
  <text x="650" y="427" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Encoder Memory  M ∈ ℝ⁽²⁵⁶ × ²⁵⁶⁾</text>
  <text x="650" y="443" text-anchor="middle" font-size="10" fill="#E0F2FE" font-style="italic">consumed by decoder cross-attention; not re-encoded per AR step</text>
</g>

<!-- arrow memory -> decoder -->
<path d="M 650 450 L 650 480" stroke="#0369A1" stroke-width="2.5" fill="none" marker-end="url(#a-tl)"/>

<!-- ============================================================ -->
<!-- 3. TRANSFORMER DECODER                                       -->
<!-- ============================================================ -->
<g>
  <rect x="240" y="485" width="820" height="290" rx="12" fill="url(#dec-grad)" stroke="#1D4ED8" stroke-width="2" filter="url(#shadow-lg)"/>
  <text x="650" y="512" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Transformer Decoder (31.28M params)</text>
  <text x="650" y="534" text-anchor="middle" font-size="11" fill="#1E40AF" font-style="italic">8 layers, d_model=384, 12 heads/layer, GELU FFN, dropout 0.1, pre-LayerNorm</text>

  <!-- One layer expanded -->
  <g>
    <rect x="280" y="555" width="740" height="195" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="650" y="575" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Decoder Layer ℓ  (× 8 stacked)</text>

    <g>
      <rect x="300" y="590" width="200" height="48" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
      <text x="400" y="610" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Masked Self-Attention</text>
      <text x="400" y="627" text-anchor="middle" font-size="9" fill="#475569">causal mask over y_{1:t-1}</text>
    </g>

    <g>
      <rect x="520" y="590" width="200" height="48" rx="4" fill="#EFF6FF" stroke="#3B82F6" filter="url(#glow-blue)"/>
      <text x="620" y="610" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Cross-Attention</text>
      <text x="620" y="627" text-anchor="middle" font-size="9" fill="#475569">Q=hidden, K,V=memory M</text>
    </g>

    <g>
      <rect x="740" y="590" width="200" height="48" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
      <text x="840" y="610" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Feed-Forward (GELU)</text>
      <text x="840" y="627" text-anchor="middle" font-size="9" fill="#475569">d_ff=1536, dropout 0.1</text>
    </g>

    <path d="M 500 614 L 520 614" stroke="#1E40AF" stroke-width="1.5" fill="none" marker-end="url(#a-bl)"/>
    <path d="M 720 614 L 740 614" stroke="#1E40AF" stroke-width="1.5" fill="none" marker-end="url(#a-bl)"/>

    <text x="650" y="667" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">residual + LayerNorm after each sublayer (pre-norm)</text>

    <g>
      <rect x="300" y="685" width="320" height="48" rx="4" fill="#F0FDFA" stroke="#0D9488"/>
      <text x="460" y="705" text-anchor="middle" font-size="11" font-weight="700" fill="#134E4A">Token Embedding + Positional Encoding</text>
      <text x="460" y="722" text-anchor="middle" font-size="9" fill="#475569">vocab=2,418  ·  learned sinusoidal positions</text>
    </g>

    <g>
      <rect x="640" y="685" width="300" height="48" rx="4" fill="#F0FDFA" stroke="#0D9488"/>
      <text x="790" y="705" text-anchor="middle" font-size="11" font-weight="700" fill="#134E4A">Scheduled Sampling (training)</text>
      <text x="790" y="722" text-anchor="middle" font-size="9" fill="#475569">p_max swept ∈ {0, .25, .5, .75}; SS=0 deployed</text>
    </g>
  </g>
</g>

<!-- arrow decoder -> hidden state hub -->
<path d="M 650 775 L 650 815" stroke="#1E40AF" stroke-width="2.5" fill="none" marker-end="url(#a-bl)"/>

<!-- Hidden state pill -->
<g>
  <rect x="480" y="816" width="340" height="38" rx="18" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/>
  <text x="650" y="836" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Decoder Hidden State  h_t ∈ ℝ³⁸⁴</text>
  <text x="650" y="850" text-anchor="middle" font-size="9" fill="#475569" font-style="italic">shared across all six heads</text>
</g>

<!-- ============================================================ -->
<!-- 4. SIX HEADS                                                 -->
<!-- ============================================================ -->
<g>
  <!-- Token head (legacy, primary) -->
  <g>
    <rect x="80" y="890" width="195" height="105" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#shadow-lg)"/>
    <text x="177" y="912" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">Token Head</text>
    <text x="177" y="930" text-anchor="middle" font-size="10" fill="#991B1B" font-style="italic">PRIMARY · inference</text>
    <text x="177" y="950" text-anchor="middle" font-size="10" fill="#1F2937">2,418-class softmax</text>
    <text x="177" y="966" text-anchor="middle" font-size="10" fill="#1F2937">over full vocabulary</text>
    <text x="177" y="984" text-anchor="middle" font-size="9" fill="#475569">bigram + FSM mask applied</text>
  </g>

  <!-- Type head -->
  <g>
    <rect x="285" y="890" width="170" height="105" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.2" filter="url(#shadow-lg)"/>
    <text x="370" y="912" text-anchor="middle" font-size="12" font-weight="700" fill="#7C2D12">Type Head</text>
    <text x="370" y="928" text-anchor="middle" font-size="9" fill="#9A3412" font-style="italic">auxiliary, multi-task</text>
    <text x="370" y="948" text-anchor="middle" font-size="10" fill="#1F2937">4-way: SPECIAL / CMD /</text>
    <text x="370" y="964" text-anchor="middle" font-size="10" fill="#1F2937">PARAM / NUMERIC</text>
    <text x="370" y="982" text-anchor="middle" font-size="9" fill="#475569">per-position classifier</text>
  </g>

  <!-- Command head -->
  <g>
    <rect x="465" y="890" width="170" height="105" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.2" filter="url(#shadow-lg)"/>
    <text x="550" y="912" text-anchor="middle" font-size="12" font-weight="700" fill="#713F12">Motion-Command</text>
    <text x="550" y="928" text-anchor="middle" font-size="9" fill="#854D0E" font-style="italic">auxiliary, multi-task</text>
    <text x="550" y="948" text-anchor="middle" font-size="10" fill="#1F2937">6-way: G0 / G1 / G2 /</text>
    <text x="550" y="964" text-anchor="middle" font-size="10" fill="#1F2937">G3 / G53 / M30</text>
    <text x="550" y="982" text-anchor="middle" font-size="9" fill="#475569">per-COMMAND position</text>
  </g>

  <!-- Param-type head -->
  <g>
    <rect x="645" y="890" width="170" height="105" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.2" filter="url(#shadow-lg)"/>
    <text x="730" y="912" text-anchor="middle" font-size="12" font-weight="700" fill="#14532D">Parameter-Type</text>
    <text x="730" y="928" text-anchor="middle" font-size="9" fill="#166534" font-style="italic">auxiliary, multi-task</text>
    <text x="730" y="948" text-anchor="middle" font-size="10" fill="#1F2937">10-way: X / Y / Z /</text>
    <text x="730" y="964" text-anchor="middle" font-size="10" fill="#1F2937">I / J / K / R / F / S / P</text>
    <text x="730" y="982" text-anchor="middle" font-size="9" fill="#475569">per-PARAM position</text>
  </g>

  <!-- Sign head -->
  <g>
    <rect x="825" y="890" width="170" height="105" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" filter="url(#shadow-lg)"/>
    <text x="910" y="912" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">Sign Head</text>
    <text x="910" y="928" text-anchor="middle" font-size="9" fill="#1E40AF" font-style="italic">auxiliary, multi-task</text>
    <text x="910" y="948" text-anchor="middle" font-size="10" fill="#1F2937">3-way:</text>
    <text x="910" y="964" text-anchor="middle" font-size="10" fill="#1F2937">POS / NEG / ABSENT</text>
    <text x="910" y="982" text-anchor="middle" font-size="9" fill="#475569">per-axis-value</text>
  </g>

  <!-- Digit head -->
  <g>
    <rect x="1005" y="890" width="215" height="105" rx="8" fill="#FDF4FF" stroke="#A21CAF" stroke-width="1.2" filter="url(#shadow-lg)"/>
    <text x="1112" y="912" text-anchor="middle" font-size="12" font-weight="700" fill="#581C87">Per-Position Digit Head</text>
    <text x="1112" y="928" text-anchor="middle" font-size="9" fill="#6B21A8" font-style="italic">auxiliary, regression-style</text>
    <text x="1112" y="948" text-anchor="middle" font-size="10" fill="#1F2937">6 positions × 11 classes</text>
    <text x="1112" y="964" text-anchor="middle" font-size="10" fill="#1F2937">(digits 0–9 + PAD)</text>
    <text x="1112" y="982" text-anchor="middle" font-size="9" fill="#475569">complements bucket softmax</text>
  </g>

  <!-- Fan-out from hidden state to all heads -->
  <g stroke="#475569" stroke-width="1.2" fill="none" stroke-dasharray="3 2">
    <path d="M 540 854 L 540 870 L 177 870 L 177 890" marker-end="url(#a)"/>
    <path d="M 580 854 L 580 870 L 370 870 L 370 890" marker-end="url(#a)"/>
    <path d="M 620 854 L 620 870 L 550 870 L 550 890" marker-end="url(#a)"/>
    <path d="M 680 854 L 680 870 L 730 870 L 730 890" marker-end="url(#a)"/>
    <path d="M 720 854 L 720 870 L 910 870 L 910 890" marker-end="url(#a)"/>
    <path d="M 760 854 L 760 870 L 1112 870 L 1112 890" marker-end="url(#a)"/>
  </g>
</g>

<!-- ============================================================ -->
<!-- 5. GRAMMAR-MASKED INFERENCE                                  -->
<!-- ============================================================ -->
<g>
  <rect x="80" y="1030" width="1140" height="115" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#shadow-lg)"/>
  <text x="650" y="1055" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Grammar-Constrained Decoding  (inference time only)</text>

  <g>
    <rect x="120" y="1075" width="280" height="55" rx="6" fill="#FFFFFF" stroke="#1F2937"/>
    <text x="260" y="1095" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Bigram Mask  M_b ∈ {0,1}^{|V|×|V|}</text>
    <text x="260" y="1112" text-anchor="middle" font-size="9" fill="#475569" font-style="italic">first-order ordering (CMD→PARAM→NUM…)</text>
    <text x="260" y="1126" text-anchor="middle" font-size="9" fill="#475569">|V|=2,418 → avg 31.8 valid next tokens</text>
  </g>

  <g>
    <rect x="430" y="1075" width="280" height="55" rx="6" fill="#FFFFFF" stroke="#1F2937"/>
    <text x="570" y="1095" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">FSM Mask  (state-dependent)</text>
    <text x="570" y="1112" text-anchor="middle" font-size="9" fill="#475569" font-style="italic">G0/G1 forbid R/I/J; M30 forbids continuation</text>
    <text x="570" y="1126" text-anchor="middle" font-size="9" fill="#475569">tracks last move-command as state</text>
  </g>

  <g>
    <rect x="740" y="1075" width="350" height="55" rx="6" fill="#FFFFFF" stroke="#1F2937"/>
    <text x="915" y="1095" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Apply to Token-Head logits before softmax</text>
    <text x="915" y="1112" text-anchor="middle" font-size="9" fill="#475569" font-style="italic">ℓ_t ← ℓ_t · M_b[y_{t-1}, :] · FSM_mask(s_t)</text>
    <text x="915" y="1126" text-anchor="middle" font-size="9" fill="#475569">100% V1-violation elimination at no accuracy cost</text>
  </g>

  <path d="M 400 1102 L 430 1102" stroke="#1F2937" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M 710 1102 L 740 1102" stroke="#1F2937" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</g>

<!-- arrow heads (token head) -> grammar -->
<path d="M 177 995 L 177 1030" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#a-rd)"/>
