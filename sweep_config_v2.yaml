program: scripts/evaluation/run_decoder_quick_test.py
method: bayes
metric:
  name: val/token_accuracy
  goal: maximize

parameters:
  # Fixed - encoder is decided
  encoder_config:
    value: f110_w256_s64

  # Expanded boundaries
  d_model:
    values: [256, 384, 512]
  lr:
    values: [0.0005, 0.001, 0.002]
  dropout:
    values: [0.05, 0.1]
  digit_weight:
    values: [10, 15, 20]

  # Keep exploring these
  n_layers:
    values: [2, 4, 6]
  n_heads:
    values: [4, 8]
  batch_size:
    values: [16, 32]
  legacy_weight:
    values: [0.5, 1.0]
  label_smoothing:
    values: [0.0, 0.1, 0.2]
  scheduled_sampling:
    values: [0.0, 0.3, 0.5]
  focal_gamma:
    values: [0.0, 1.0, 2.0]
  weight_decay:
    values: [0.01, 0.05]

command:
  - ${env}
  - python3
  - ${program}
  - --vocab=data/gcode_vocab_712.json
  - --output_dir=outputs/decoder20260304/sweep_v2
  - --epochs=250
  - --patience=50
  - --wandb
  - --wandb_project=decoder-sweep-v2
  - ${args}
