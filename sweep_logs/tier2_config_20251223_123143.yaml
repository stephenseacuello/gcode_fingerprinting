# Tier 2: Data Augmentation & Training Strategy Sweep
# Focus: Optimize data augmentation and training techniques using best architecture from Tier 1
#
# Usage:
#   wandb sweep configs/sweep_tier2_augmentation.yaml
#   wandb agent <sweep_id>

program: scripts/train_sensor_multihead.py
method: bayes
metric:
  name: val/sequence_accuracy
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
  s: 2

command:
  - .venv/bin/python
  - ${program}
  - --use-wandb
  - --wandb-project=gcode-sweep-tier2
  - --max-epochs=40
  - --patience=10
  - --split-dir=outputs/processed_v3
  - --vocab-path=data/vocabulary_4digit_full.json
  - --encoder-path=outputs/mm_dtae_lstm_v2/best_model.pt
  - --use-enhanced-encoder
  - --use-multiscale-encoder
  - --use-multihead-pooling
  # Architecture from Tier 1 best (defaults - update after Tier 1)
  - --d-model=256
  - --n-layers=4
  - --n-heads=8
  - --dropout=0.3
  - --learning-rate=0.0002
  - --optimizer=adamw
  - --output-dir=outputs/sweep_runs/${env:WANDB_RUN_ID:sweep_run}
  # Fixed boolean flags
  - --augment
  - --use-focal-loss
  - --curriculum
  - --scheduled-sampling
  - ${args}

parameters:
  # === Data Augmentation (PRIMARY FOCUS) ===
  augment-prob:
    distribution: uniform
    min: 0.1
    max: 0.6
  noise-level:
    distribution: uniform
    min: 0.005
    max: 0.05
  shift-range:
    values: [1, 2, 3]
  scale-range-min:
    values: [0.95, 0.97, 0.98]
  scale-range-max:
    values: [1.02, 1.03, 1.05]
  time-warp-sigma:
    distribution: uniform
    min: 0.05
    max: 0.25
  feature-dropout-prob:
    distribution: uniform
    min: 0.0
    max: 0.15
  cutout-length:
    values: [1, 2, 3, 4]
  jitter-sigma:
    distribution: uniform
    min: 0.002
    max: 0.02
  oversample-factor:
    values: [2, 3, 5]

  # === Training Strategy ===
  teacher-forcing-start:
    values: [0.9, 1.0]
  teacher-forcing-end:
    values: [0.1, 0.2, 0.3, 0.5]
  teacher-forcing-decay-epochs:
    values: [30, 50, 70]

  # === Focal Loss Tuning ===
  focal-gamma:
    values: [1.0, 2.0, 3.0, 4.0]
  focal-alpha:
    distribution: uniform
    min: 0.15
    max: 0.5
  digit-focal-gamma:
    values: [3.0, 5.0, 7.0, 9.0]
  label-smoothing:
    distribution: uniform
    min: 0.0
    max: 0.15

  # === Grammar Constraints ===
  grammar-weight:
    distribution: uniform
    min: 0.0
    max: 0.3
