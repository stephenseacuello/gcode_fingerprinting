# Tier 3: Loss Weights & SCST Fine-Tuning Sweep
# Focus: Fine-tune loss weights and enable SCST for sequence-level optimization
# Duration: ~4 days (300 runs across 8 GPUs)
#
# Note: Architecture params from Tier 1 and augmentation params from Tier 2
#       should be injected via the launch script
#
# Usage:
#   # After Tier 2 completes, inject best configs:
#   envsubst < configs/sweep_tier3_finetuning.yaml > configs/sweep_tier3_resolved.yaml
#   wandb sweep configs/sweep_tier3_resolved.yaml

program: scripts/train_sensor_multihead.py
method: bayes
metric:
  name: val/sequence_accuracy
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 5
  eta: 3
  s: 2

command:
  - ${env}
  - .venv/bin/python
  - ${program}
  - --use-wandb
  - --wandb-project=gcode-sweep-tier3
  - --max-epochs=25
  - --patience=8
  - --split-dir=outputs/processed_v3
  - --vocab-path=data/vocabulary_4digit_full.json
  - --encoder-path=outputs/mm_dtae_lstm_v2/best_model.pt
  - --use-enhanced-encoder
  - --use-multiscale-encoder
  - --use-multihead-pooling
  # Architecture from Tier 1 (defaults - update after Tier 1)
  - --d-model=256
  - --n-layers=4
  - --n-heads=8
  - --dropout=0.3
  - --learning-rate=0.0002
  - --optimizer=adamw
  # Augmentation from Tier 2 (defaults - update after Tier 2)
  - --augment
  - --augment-prob=0.3
  - --noise-level=0.01
  - --time-warp-sigma=0.1
  - --focal-gamma=2.0
  - ${args}

parameters:
  # === Loss Weights (PRIMARY FOCUS) ===
  type_weight:
    distribution: uniform
    min: 0.3
    max: 2.0
  command_weight:
    distribution: uniform
    min: 0.5
    max: 2.5
  param_type_weight:
    distribution: uniform
    min: 0.3
    max: 1.5
  digit_weight:
    distribution: uniform
    min: 0.5
    max: 2.0

  # === Grammar Constraint Weights ===
  use_grammar_constraints:
    value: true
  grammar_weight:
    distribution: uniform
    min: 0.05
    max: 0.4
  constraint_arc_radius_weight:
    distribution: uniform
    min: 0.5
    max: 2.0
  constraint_modal_group_weight:
    distribution: uniform
    min: 0.3
    max: 1.2
  constraint_cmd_param_weight:
    distribution: uniform
    min: 0.2
    max: 1.0
  constraint_rapid_feed_weight:
    distribution: uniform
    min: 0.2
    max: 0.8
  constraint_modal_state_weight:
    distribution: uniform
    min: 0.1
    max: 0.6

  # === SCST (ENABLED IN TIER 3) ===
  use_scst:
    values: [true, false]
  scst_start_epoch:
    values: [80, 100, 120]
  scst_weight:
    distribution: uniform
    min: 0.1
    max: 0.6
  scst_lr:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.00005
  sample_temperature:
    distribution: uniform
    min: 0.6
    max: 1.2
  use_mixed_reward:
    values: [true, false]

  # === Advanced Training ===
  use_swa:
    values: [true, false]
  grad_clip:
    values: [0.5, 1.0, 2.0]
  accumulation_steps:
    values: [1, 2, 4]

  # === Scheduled Sampling (from Tier 2, fine-tune) ===
  scheduled_sampling:
    value: true
  teacher_forcing_end:
    values: [0.1, 0.2, 0.3]
