# Tier 1: Architecture & Optimization Sweep
# Focus: Find optimal model architecture and learning setup
#
# Usage:
#   wandb sweep configs/sweep_tier1_architecture.yaml
#   wandb agent <sweep_id>

program: scripts/train_sensor_multihead.py
method: bayes
metric:
  name: val/sequence_accuracy
  goal: maximize

# Early stopping via Hyperband
early_terminate:
  type: hyperband
  min_iter: 3
  eta: 3
  s: 2

command:
  - .venv/bin/python
  - ${program}
  - --use-wandb
  - --wandb-project=gcode-sweep-tier1
  - --max-epochs=30
  - --patience=10
  - --split-dir=outputs/processed_v3
  - --vocab-path=data/vocabulary_4digit_full.json
  - --encoder-path=outputs/mm_dtae_lstm_v2/best_model.pt
  - --use-enhanced-encoder
  - --use-multiscale-encoder
  - --use-multihead-pooling
  - --output-dir=outputs/sweep_runs/${env:WANDB_RUN_ID:sweep_run}
  # Fixed boolean flags (not in parameters)
  - --curriculum
  - --use-focal-loss
  - --batch-size=32
  - --focal-gamma=2.0
  - ${args}

parameters:
  # === Architecture (PRIMARY FOCUS) ===
  d-model:
    values: [128, 192, 256, 320, 512]
  n-layers:
    values: [3, 4, 5, 6]
  n-heads:
    values: [4, 8]
  dropout:
    distribution: uniform
    min: 0.1
    max: 0.4
  embed-dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
  d-ff-multiplier:
    values: [3.0, 4.0, 5.0]

  # === Optimizer ===
  optimizer:
    values: [adamw, adam]
  learning-rate:
    distribution: log_uniform_values
    min: 0.00005
    max: 0.005
  weight-decay:
    distribution: log_uniform_values
    min: 0.01
    max: 0.15
  beta1:
    values: [0.9, 0.95]
  beta2:
    values: [0.98, 0.99, 0.999]

  # === LR Scheduler ===
  lr-scheduler:
    values: [cosine, plateau, warmup_cosine]
  warmup-epochs:
    values: [3, 5, 10]
  cosine-t-max:
    values: [50, 80, 100]
